# Worker pool used by ax on the agent-substrate cluster.
#
# FALLBACK (hostname pin). Workers run on nodes from the substrate-workers ComputeClass
# (computeclass-substrate-workers.yaml): N4 only, so gVisor snapshots always
# restore on the same CPU platform; GKE labels those nodes with
# ate.dev/substrate-version and taints them for workers only.
# (The previous setup pinned every worker to one E2 node by hostname; see
# workerpool-hostname.yaml if the ComputeClass is unavailable.)
#
# workerImage is the v0.4.0 ateom-gvisor image, pinned by digest.
apiVersion: v1
kind: Namespace
metadata:
  name: ax-workers
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: ax-pool
  namespace: ax-workers
spec:
  replicas: 4
  sandboxClass: gvisor
  workerImage: us-central1-docker.pkg.dev/gke-demos-345619/ax/substrate/ateom-gvisor:v0.4.0@sha256:a85055188241fb4ef6c59d7cd841c8855bc1204ffae5a3c187ba3b24395c13a6
  template:
    nodeSelector:
      kubernetes.io/hostname: gke-agent-substrate-default-pool-447e9856-6v23
      ate.dev/substrate-version: v0.4.0
