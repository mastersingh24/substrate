# GKE ComputeClass for Substrate workers on agent-substrate.
#
# Why: gVisor snapshots only restore on the same CPU feature set, and the
# default pool's E2 machines mix Intel and AMD hosts. Until now the workers were
# pinned to one E2 node by hostname, which breaks the moment GKE recreates that
# node (new name, no labels) and crowded every system pod onto it.
#
# This class gives workers their own auto-created nodes:
# - N4 first, C4 as fallback when N4 is out of stock: both run the same CPU
#   (Intel Xeon Platinum 8581C), so a FULL snapshot taken on either restores on
#   the other. Tested 2026-10-10/11 both ways with a live mast agent
#   (v04-migration/snaptest-c4.sh: N4->C4 and C4->N4, mast never restarted).
#   gVisor refuses a restore when the host lacks any CPU feature recorded in
#   the snapshot, so never add a family with a different CPU (E2 mixes AMD and
#   Intel; moving from AMD E2 to N4 stranded every snapshot).
# - nodeLabels stamps ate.dev/substrate-version on every node GKE creates, so
#   atelet (whose DaemonSet selects on that label) runs on new nodes too; the
#   v0.4 installer only labels nodes that exist when it runs.
# - The ate.dev/sandboxClass=gvisor:NoSchedule taint is Substrate's own worker
#   taint: worker pods and atelet already tolerate it, everything else stays
#   off. (GKE also taints compute-class nodes for the class itself and adds
#   the toleration to pods that select the class.)
# - When upgrading Substrate, change the version label here together with
#   install.sh's VERSION and the WorkerPool's nodeSelector.
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: substrate-workers
spec:
  priorities:
    - machineFamily: n4
    - machineFamily: c4
  nodePoolAutoCreation:
    enabled: true
  nodePoolConfig:
    nodeLabels:
      ate.dev/substrate-version: v0.4.0
    taints:
      - key: ate.dev/sandboxClass
        value: gvisor
        effect: NoSchedule
  activeMigration:
    optimizeRulePriority: true
  whenUnsatisfiable: DoNotScaleUp
